<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PrivacyVault - Offline AES-256</title>
    <!-- StreamSaver Library (Local File) -->
    <script src="./StreamSaver.min.js"></script>
    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: #111827;
            --primary: #1e293b;
            --primary-light: #334155;
            
            --accent: #00d8ff;
            --accent-hover: #00b4d8;
            
            --success: #00d8ff;
            --success-hover: #00b4d8;
            --warning: #f59e0b;
            --warning-hover: #d97706;
            
            --border: #1f293d;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            --radius: 18px;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            color: var(--text-main); 
            min-height: 100vh; 
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container { 
            width: 100%;
            max-width: 520px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            border-radius: var(--radius); 
            box-shadow: var(--shadow); 
            overflow: hidden; 
            border: 1px solid var(--border);
        }

        .app-header { 
            background: #111827; 
            color: white; 
            padding: 24px 20px; 
            text-align: center; 
            position: relative;
            border-bottom: 1px solid var(--border);
        }

        .app-header h1 { 
            font-size: 1.6rem; 
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px; 
            color: #ffffff;
        }

        .app-header h1 span {
            color: var(--accent);
        }

        .offline-badge { 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            background: rgba(0, 216, 255, 0.08); 
            backdrop-filter: blur(8px);
            color: #94a3b8; 
            padding: 5px 14px; 
            border-radius: 20px; 
            font-size: 0.72rem; 
            font-weight: 600; 
            border: 1px solid rgba(0, 216, 255, 0.2);
        }

        .offline-badge::before {
            content: '';
            display: inline-block;
            width: 7px;
            height: 7px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
        }

        .tabs { 
            display: flex; 
            background: #0f172a; 
            padding: 5px; 
            margin: 18px 18px 0 18px; 
            border-radius: 14px; 
            gap: 4px; 
            border: 1px solid var(--border);
        }

        .tab-btn { 
            flex: 1; 
            padding: 10px 6px; 
            background: transparent; 
            border: none; 
            font-size: 0.82rem; 
            font-weight: 600; 
            color: var(--text-muted); 
            cursor: pointer; 
            border-radius: 10px; 
            transition: all 0.2s ease;
        }

        .tab-btn.active { 
            color: #0b0f19; 
            background: var(--accent); 
            box-shadow: 0 2px 8px rgba(0, 216, 255, 0.3); 
        }

        .tab-content { display: none; padding: 20px; }
        .tab-content.active { display: block; }

        .input-group {
            position: relative;
            margin-bottom: 14px;
        }

        label { 
            font-weight: 600; 
            font-size: 0.82rem; 
            color: #cbd5e1;
            margin-bottom: 6px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        textarea, input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 12px 14px; 
            border: 1.5px solid var(--border); 
            border-radius: 12px; 
            font-size: 0.92rem; 
            background: #0f172a; 
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        textarea:focus, input[type="text"]:focus, input[type="password"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 216, 255, 0.15);
        }

        textarea { height: 110px; resize: vertical; font-family: inherit; }

        .toggle-pwd {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 6px;
        }

        .btn-group { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
        
        button.btn-action { 
            padding: 12px 16px; 
            border: none; 
            border-radius: 12px; 
            font-size: 0.88rem;
            font-weight: 700; 
            cursor: pointer; 
            flex: 1; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        button.btn-action:active { transform: scale(0.98); }

        .btn-enc { background: var(--accent); color: #0b0f19; }
        .btn-enc:hover { background: var(--accent-hover); }
        .btn-dec { background: #1e293b; color: #f8fafc; border: 1px solid var(--border); }
        .btn-dec:hover { background: #334155; }
        .btn-warning { background: var(--warning); color: #0b0f19; }
        .btn-warning:hover { background: var(--warning-hover); }
        .btn-secondary { background: #1e293b; color: #cbd5e1; border: 1px solid var(--border); }
        .btn-secondary:hover { background: #334155; }

        .result-box { 
            background: #0f172a; 
            border: 1.5px dashed var(--border); 
            padding: 14px; 
            border-radius: 12px; 
            margin-top: 14px; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 0.85rem;
            word-break: break-all; 
            color: #cbd5e1;
            min-height: 50px;
            position: relative;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: #1e293b;
            border-radius: 10px;
            margin-top: 8px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.2s ease;
        }

        .file-zone { 
            border: 2px dashed var(--border); 
            border-radius: 14px; 
            padding: 28px 16px; 
            text-align: center; 
            cursor: pointer; 
            background: #0f172a; 
            transition: all 0.2s ease;
        }

        .file-zone:hover {
            border-color: var(--accent);
        }

        .file-zone-icon {
            font-size: 2rem;
            margin-bottom: 6px;
            display: block;
            color: var(--accent);
        }

        .file-zone p {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="app-header">
        <h1>Privacy<span>Vault</span></h1>
        <div class="offline-badge">Data never leaves your device</div>
    </div>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('text', this)">Text</button>
        <button class="tab-btn" onclick="switchTab('file', this)">Files</button>
        <button class="tab-btn" onclick="switchTab('handshake', this)">Handshake</button>
    </div>

    <!-- Text Tab -->
    <div id="tab-text" class="tab-content active">
        <div class="input-group">
            <label>Encryption Key</label>
            <div class="input-wrapper">
                <input type="password" id="keyInput" placeholder="Enter secret key..." autocomplete="off" autocapitalize="off">
                <button type="button" class="toggle-pwd" onclick="togglePassword('keyInput', this)">Show</button>
            </div>
        </div>

        <div class="input-group">
            <label>
                Text 
                <span style="font-weight: normal; color: var(--accent); cursor: pointer;" onclick="clearText('textInput')">Clear</span>
            </label>
            <textarea id="textInput" placeholder="Type or paste your text here..."></textarea>
        </div>

        <div class="btn-group">
            <button class="btn-action btn-enc" onclick="processText(true)">Encrypt Text</button>
            <button class="btn-action btn-dec" onclick="processText(false)">Decrypt Text</button>
        </div>

        <div class="result-box" id="resultOutput">Result will appear here...</div>
        <button class="btn-action btn-secondary" onclick="copyToClipboard('resultOutput')" style="margin-top: 8px; width: 100%;">Copy Result</button>
    </div>

    <!-- File Tab -->
    <div id="tab-file" class="tab-content">
        <div class="input-group">
            <label>Encryption Key</label>
            <div class="input-wrapper">
                <input type="password" id="fileKey" placeholder="Enter secret key..." autocomplete="off" autocapitalize="off">
                <button type="button" class="toggle-pwd" onclick="togglePassword('fileKey', this)">Show</button>
            </div>
        </div>

        <div class="file-zone" id="fileZone" onclick="document.getElementById('fileInput').click()">
            <span class="file-zone-icon">☁️</span>
            <p id="fileZoneText">Select or Drop Any File (Images, PDF, Video, Docs)</p>
        </div>
        <input type="file" id="fileInput" style="display:none;" onchange="handleFileSelect(event)">
        <p id="fileStatus" style="font-size:0.78rem; color: var(--accent); margin-top:6px; text-align:center; font-weight:600;"></p>

        <div class="btn-group">
            <button class="btn-action btn-enc" onclick="encryptFile()">Encrypt File</button>
            <button class="btn-action btn-dec" onclick="decryptFile()">Decrypt File</button>
        </div>

        <div class="result-box" id="fileResult">
            <span id="fileResultText">Output status...</span>
            <div class="progress-bar-container" id="progressBarContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>

    <!-- Handshake Tab -->
    <div id="tab-handshake" class="tab-content">
        <div class="input-group">
            <label>Your Public Key</label>
            <textarea id="myPublicKey" readonly placeholder="Click 'Generate' to create a key pair..."></textarea>
            <button class="btn-action btn-secondary" onclick="copyToClipboard('myPublicKey')" style="margin-top: 6px; width: 100%;">Copy My Key</button>
        </div>

        <div class="input-group" style="margin-top: 14px;">
            <label>Peer's Public Key</label>
            <textarea id="peerPublicKey" placeholder="Paste peer's public key here..."></textarea>
        </div>

        <div class="btn-group">
            <button class="btn-action btn-warning" onclick="generateKeyPair()">Generate</button>
            <button class="btn-action btn-warning" onclick="deriveSharedKey()">Derive Shared Key</button>
        </div>
        <p id="handshakeStatus" style="font-size:0.8rem; color: var(--accent); margin-top:8px; text-align: center; font-weight: 600;"></p>
    </div>

    <!-- Clear Session Button -->
    <div style="text-align: center; padding: 16px; border-top: 1px solid var(--border);">
        <button class="btn-action btn-secondary" onclick="clearSession()" style="width: 100%;">Clear Session</button>
    </div>
</div>

<script>
    // ======================== Configuration & State ========================
    const MAX_FILE_SIZE = 10 * 1024 * 1024 * 1024; // 10GB maximum allowed file size
    const CHUNK_SIZE = 1 * 1024 * 1024;             // 1MB per encryption/decryption chunk
    let selectedFileData = null;                    // Holds the currently selected file object
    let localKeyPair = null;                        // Holds the generated ECDH key pair

    // ======================== Crypto Utilities ========================
    async function deriveKey(password, salt) {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
            "raw",
            enc.encode(password),
            "PBKDF2",
            false,
            ["deriveKey"]
        );
        return crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: salt, iterations: 200000, hash: "SHA-256" },
            keyMaterial,
            { name: "AES-GCM", length: 256 },
            false,
            ["encrypt", "decrypt"]
        );
    }

    function generateRandomSalt() {
        return crypto.getRandomValues(new Uint8Array(16));
    }

    function arrayBufferToBase64(buffer) {
        const bytes = buffer instanceof Uint8Array ? buffer : new Uint8Array(buffer);
        let binary = '';
        const chunkSize = 0x8000;
        for (let i = 0; i < bytes.length; i += chunkSize) {
            binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
        }
        return btoa(binary);
    }

    function base64ToArrayBuffer(base64) {
        const binaryString = atob(base64);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }
        return bytes.buffer;
    }

    // ======================== UI Helper Functions ========================
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            btn.innerText = "Hide";
        } else {
            input.type = "password";
            btn.innerText = "Show";
        }
    }

    function clearText(elementId) {
        document.getElementById(elementId).value = "";
    }

    function copyToClipboard(elementId) {
        const el = document.getElementById(elementId);
        const text = el.value || el.innerText;
        if (!text || text === "Result will appear here..." || text === "Output status...") return;

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(() => {
                alert("Copied to clipboard!");
            }).catch(() => {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-999999px";
        document.body.appendChild(textArea);
        textArea.select();
        try {
            document.execCommand('copy');
            alert("Copied to clipboard!");
        } catch (e) {
            alert("Failed to copy.");
        }
        document.body.removeChild(textArea);
    }

    function updateProgress(percent, text) {
        const statusText = document.getElementById('fileResultText');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressBarContainer');

        progressContainer.style.display = 'block';
        progressBar.style.width = percent + '%';
        statusText.innerText = `${text} ${percent}%`;
    }

    function hideProgress() {
        document.getElementById('progressBarContainer').style.display = 'none';
        document.getElementById('progressBar').style.width = '0%';
    }

    function isStreamSaverAvailable() {
        if (typeof streamSaver === 'undefined') {
            alert("StreamSaver library failed to load. Please check your internet connection and try again.");
            return false;
        }
        return true;
    }

    // ======================== Tab Switching ========================
    function switchTab(name, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + name).classList.add('active');
        btn.classList.add('active');
    }

    // ======================== Text Encryption / Decryption ========================
    async function processText(isEncrypt) {
        const text = document.getElementById('textInput').value;
        const password = document.getElementById('keyInput').value.trim();
        const out = document.getElementById('resultOutput');

        if (!password) { alert("Please enter a secret key."); return; }
        if (!text) { alert("Please enter text."); return; }

        try {
            out.innerText = "Deriving key...";
            if (isEncrypt) {
                const salt = generateRandomSalt();
                const key = await deriveKey(password, salt);
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const cipher = await crypto.subtle.encrypt(
                    { name: "AES-GCM", iv: iv },
                    key,
                    new TextEncoder().encode(text)
                );
                out.innerText = arrayBufferToBase64(salt) + ":" + arrayBufferToBase64(iv) + ":" + arrayBufferToBase64(cipher);
            } else {
                const parts = text.split(":");
                if (parts.length < 3) {
                    out.innerText = "Invalid encrypted format.";
                    return;
                }
                const salt = new Uint8Array(base64ToArrayBuffer(parts[0]));
                const iv = new Uint8Array(base64ToArrayBuffer(parts[1]));
                const key = await deriveKey(password, salt);
                const decrypted = await crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv },
                    key,
                    base64ToArrayBuffer(parts[2])
                );
                out.innerText = new TextDecoder().decode(decrypted);
            }
        } catch (e) {
            out.innerText = "Operation failed. Check key/data.";
        }
    }

    // ======================== File Selection & Drag & Drop ========================
    function handleFileSelect(e) {
        const file = e.target.files[0];
        if (!file) return;

        if (file.size > MAX_FILE_SIZE) {
            alert("File is too large! Max 10GB allowed.");
            selectedFileData = null;
            document.getElementById('fileZoneText').innerText = "Select or Drop Any File (Images, PDF, Video, Docs)";
            document.getElementById('fileStatus').innerText = "";
            document.getElementById('fileInput').value = '';
            return;
        }

        selectedFileData = file;
        document.getElementById('fileZoneText').innerText = file.name;
        document.getElementById('fileStatus').innerText = "(" + (file.size / 1024 / 1024).toFixed(2) + " MB)";
        document.getElementById('fileInput').value = '';
    }

    (function setupDragDrop() {
        const fileZone = document.getElementById('fileZone');
        if (!fileZone) return;

        fileZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileZone.style.borderColor = 'var(--accent)';
        });

        fileZone.addEventListener('dragleave', () => {
            fileZone.style.borderColor = 'var(--border)';
        });

        fileZone.addEventListener('drop', (e) => {
            e.preventDefault();
            fileZone.style.borderColor = 'var(--border)';
            const files = e.dataTransfer.files;
            if (files.length) {
                handleFileSelect({ target: { files } });
            }
        });
    })();

    // ======================== File Encryption ========================
    async function encryptFile() {
        if (!selectedFileData) return alert("Select a file first.");
        const password = document.getElementById('fileKey').value.trim();
        if (!password) return alert("Enter a secret key.");

        // NEW: Check if running in a secure context (not file://)
        if (location.protocol === 'file:') {
            alert("File encryption requires a secure context.\nPlease host this page on HTTPS (e.g., GitHub Pages) or run it on localhost.\nText encryption still works from file://.");
            return;
        }

        if (selectedFileData.size === 0) {
            const proceed = confirm("The selected file is empty. Do you want to encrypt it anyway?");
            if (!proceed) {
                document.getElementById('fileResultText').innerText = "Encryption cancelled.";
                return;
            }
        }

        if (!isStreamSaverAvailable()) return;

        try {
            const salt = generateRandomSalt();
            const key = await deriveKey(password, salt);

            const fileStream = streamSaver.createWriteStream(selectedFileData.name + ".enc", { size: null });
            const writer = fileStream.getWriter();

            await writer.write(new Uint8Array(salt));

            let offset = 0;
            while (offset < selectedFileData.size) {
                const chunk = await selectedFileData.slice(offset, offset + CHUNK_SIZE).arrayBuffer();
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const encrypted = await crypto.subtle.encrypt(
                    { name: "AES-GCM", iv: iv },
                    key,
                    chunk
                );
                const encryptedArray = new Uint8Array(encrypted);

                const sizeBuffer = new ArrayBuffer(4);
                new DataView(sizeBuffer).setUint32(0, encryptedArray.byteLength, true);
                await writer.write(new Uint8Array(sizeBuffer));
                await writer.write(iv);
                await writer.write(encryptedArray);

                offset += CHUNK_SIZE;
                const percent = Math.min(100, ((offset / selectedFileData.size) * 100).toFixed(1));
                updateProgress(percent, "Encrypting...");
            }

            await writer.close();
            hideProgress();
            document.getElementById('fileResultText').innerText = "Encryption complete! Download started.";
        } catch (e) {
            console.error(e);
            hideProgress();
            document.getElementById('fileResultText').innerText = "Encryption failed: " + e.message;
        }
    }

    // ======================== File Decryption ========================
    async function decryptFile() {
        if (!selectedFileData) return alert("Select a file first.");
        const password = document.getElementById('fileKey').value.trim();
        if (!password) return alert("Enter a secret key.");

        // NEW: Check if running in a secure context (not file://)
        if (location.protocol === 'file:') {
            alert("File decryption requires a secure context.\nPlease host this page on HTTPS (e.g., GitHub Pages) or run it on localhost.\nText decryption still works from file://.");
            return;
        }

        if (!isStreamSaverAvailable()) return;

        if (selectedFileData.size < 16) {
            alert("This file doesn't appear to be encrypted with PrivacyVault.");
            return;
        }

        try {
            const saltBuffer = await selectedFileData.slice(0, 16).arrayBuffer();
            const salt = new Uint8Array(saltBuffer);
            const key = await deriveKey(password, salt);

            let originalName = selectedFileData.name;
            if (originalName.endsWith(".enc")) {
                originalName = originalName.slice(0, -4);
            }

            const fileStream = streamSaver.createWriteStream(originalName, { size: null });
            const writer = fileStream.getWriter();

            let offset = 16;
            const totalSize = selectedFileData.size;

            while (offset < totalSize) {
                const sizeBuffer = await selectedFileData.slice(offset, offset + 4).arrayBuffer();
                const size = new DataView(sizeBuffer).getUint32(0, true);
                offset += 4;

                if (size === 0 || (offset + 12 + size) > totalSize) {
                    throw new Error("Invalid chunk size. File may be corrupted.");
                }

                const iv = new Uint8Array(await selectedFileData.slice(offset, offset + 12).arrayBuffer());
                offset += 12;

                const encryptedData = await selectedFileData.slice(offset, offset + size).arrayBuffer();
                offset += size;

                const decrypted = await crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv },
                    key,
                    encryptedData
                );
                await writer.write(new Uint8Array(decrypted));

                const percent = Math.min(100, ((offset / totalSize) * 100).toFixed(1));
                updateProgress(percent, "Decrypting...");
            }

            await writer.close();
            hideProgress();
            document.getElementById('fileResultText').innerText = "Decryption complete! Download started.";
        } catch (e) {
            console.error(e);
            hideProgress();
            if (e.name === 'OperationError') {
                document.getElementById('fileResultText').innerText = "Incorrect password or file is corrupted.";
            } else {
                document.getElementById('fileResultText').innerText = "Decryption failed: " + e.message;
            }
        }
    }

    // ======================== Key Exchange (ECDH) ========================
    async function generateKeyPair() {
        localKeyPair = await crypto.subtle.generateKey(
            { name: "ECDH", namedCurve: "P-256" },
            true,
            ["deriveKey", "deriveBits"]
        );
        document.getElementById('myPublicKey').value = arrayBufferToBase64(
            await crypto.subtle.exportKey("spki", localKeyPair.publicKey)
        );
        document.getElementById('handshakeStatus').innerText = "Key pair generated successfully!";
    }

    async function deriveSharedKey() {
        const peerVal = document.getElementById('peerPublicKey').value.trim();
        if (!peerVal) return alert("Please enter peer's public key.");
        if (!localKeyPair) return alert("Please generate your key pair first.");

        try {
            const peer = await crypto.subtle.importKey(
                "spki",
                base64ToArrayBuffer(peerVal),
                { name: "ECDH", namedCurve: "P-256" },
                false,
                []
            );
            const secret = await crypto.subtle.deriveBits(
                { name: "ECDH", public: peer },
                localKeyPair.privateKey,
                256
            );
            const hex = Array.from(new Uint8Array(secret)).map(b => b.toString(16).padStart(2, '0')).join('');
            document.getElementById('keyInput').value = document.getElementById('fileKey').value = hex;
            document.getElementById('handshakeStatus').innerText = "Shared key derived and auto-filled!";
        } catch (e) {
            alert("Failed to derive shared key. Invalid Public Key.");
        }
    }

    // ======================== Session Cleanup ========================
    function clearSession() {
        document.getElementById('keyInput').value = '';
        document.getElementById('textInput').value = '';
        document.getElementById('fileKey').value = '';
        document.getElementById('peerPublicKey').value = '';
        document.getElementById('myPublicKey').value = '';

        document.getElementById('resultOutput').innerText = 'Result will appear here...';
        document.getElementById('fileResultText').innerText = 'Output status...';

        selectedFileData = null;
        document.getElementById('fileZoneText').innerText = 'Select or Drop Any File (Images, PDF, Video, Docs)';
        document.getElementById('fileStatus').innerText = '';
        document.getElementById('fileInput').value = '';

        localKeyPair = null;
        document.getElementById('handshakeStatus').innerText = '';

        hideProgress();

        document.getElementById('keyInput').type = 'password';
        document.getElementById('fileKey').type = 'password';
        document.querySelectorAll('.toggle-pwd').forEach(btn => btn.innerText = 'Show');

        alert('Session cleared.');
    }
</script>
</body>
</html>
