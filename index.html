<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivacyVault - Secure Client-Side Encryption Tool (Demo)</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 600px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 5px;
      color: var(--accent-color);
    }

    p.subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .tab-btn.active {
      color: var(--accent-color);
      border-bottom: 2px solid var(--accent-color);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    textarea, input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 0.9rem;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    button.btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background-color: var(--accent-color);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button.btn:hover {
      background-color: var(--accent-hover);
      color: #fff;
    }

    .result-box {
      margin-top: 15px;
      padding: 10px;
      background-color: var(--bg-color);
      border: 1px dashed var(--border-color);
      border-radius: 6px;
      word-break: break-all;
      font-family: monospace;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>PrivacyVault</h1>
  <p class="subtitle">Client-Side Zero-Knowledge Encryption Suite (Demo)</p>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('text-tab')">Text</button>
    <button class="tab-btn" onclick="switchTab('file-tab')">Files</button>
    <button class="tab-btn" onclick="switchTab('handshake-tab')">Handshake</button>
  </div>

  <!-- Text Encryption / Decryption Tab -->
  <div id="text-tab" class="tab-content active">
    <div class="form-group">
      <label for="textKey">Secret Key / Shared Key:</label>
      <input type="text" id="textKey" placeholder="Enter key or generate one in Handshake">
    </div>
    <div class="form-group">
      <label for="textData">Text Message:</label>
      <textarea id="textData" placeholder="Enter text to encrypt or ciphertext to decrypt..."></textarea>
    </div>
    <div class="btn-group">
      <button class="btn" onclick="processText('encrypt')">Encrypt Text</button>
      <button class="btn" onclick="processText('decrypt')">Decrypt Text</button>
    </div>
    <div id="textResult" class="result-box" style="display: none;"></div>
  </div>

  <!-- File Encryption / Decryption Tab -->
  <div id="file-tab" class="tab-content">
    <div class="form-group">
      <label for="fileKey">Secret Key / Shared Key:</label>
      <input type="text" id="fileKey" placeholder="Enter key for file encryption/decryption">
    </div>
    <div class="form-group">
      <label for="fileInput">Select File:</label>
      <input type="file" id="fileInput">
    </div>
    <div class="btn-group">
      <button class="btn" onclick="processFile('encrypt')">Encrypt File</button>
      <button class="btn" onclick="processFile('decrypt')">Decrypt File</button>
    </div>
  </div>

  <!-- Key Exchange (ECDH Handshake) Tab -->
  <div id="handshake-tab" class="tab-content">
    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px;">
      Generate ECDH P-256 keypair locally to compute a shared secret with another party without sharing your private key.
    </p>
    <button class="btn" style="width: 100%; margin-bottom: 15px;" onclick="generateKeypair()">1. Generate Keypair</button>
    
    <div class="form-group">
      <label>Your Public Key (Share this with recipient):</label>
      <textarea id="myPublicKey" readonly></textarea>
    </div>
    <div class="form-group">
      <label for="peerPublicKey">Recipient's Public Key:</label>
      <textarea id="peerPublicKey" placeholder="Paste recipient's public key here..."></textarea>
    </div>
    <button class="btn" style="width: 100%;" onclick="computeSharedSecret()">2. Compute Shared Secret Key</button>
    
    <div id="handshakeResult" class="result-box" style="display: none;"></div>
  </div>
</div>

<script>
  let localKeyPair = null;

  // --- UI Functions ---
  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.target.classList.add('active');
  }

  // --- Utility Functions ---
  function bufferToBase64(buf) {
    return btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
  }

  function base64ToBuffer(b64) {
    const binaryStr = atob(b64);
    const len = binaryStr.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
      bytes[i] = binaryStr.charCodeAt(i);
    }
    return bytes.buffer;
  }

  async function deriveAESKeyFromRaw(secretString) {
    const enc = new TextEncoder();
    const keyData = enc.encode(secretString);
    const hash = await crypto.subtle.digest('SHA-256', keyData);
    return crypto.subtle.importKey('raw', hash, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
  }

  // --- Text Processing ---
  async function processText(action) {
    const keyStr = document.getElementById('textKey').value.trim();
    const text = document.getElementById('textData').value.trim();
    const resultBox = document.getElementById('textResult');

    if (!keyStr || !text) {
      alert("Please provide both a secret key and input text.");
      return;
    }

    // Demo Limitation: Limit text length to 50 characters for encryption
    if (action === 'encrypt' && text.length > 50) {
      alert("Demo Version Limit: Text length is limited to 50 characters. Purchase the full source code for unlimited usage!");
      return;
    }

    try {
      const aesKey = await deriveAESKeyFromRaw(keyStr);

      if (action === 'encrypt') {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encodedText = new TextEncoder().encode(text);
        const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aesKey, encodedText);

        const combined = new Uint8Array(iv.length + encrypted.byteLength);
        combined.set(iv, 0);
        combined.set(new Uint8Array(encrypted), iv.length);

        const b64Result = bufferToBase64(combined.buffer);
        resultBox.innerText = b64Result;
        resultBox.style.display = 'block';
      } else {
        const combined = new Uint8Array(base64ToBuffer(text));
        const iv = combined.slice(0, 12);
        const data = combined.slice(12);

        const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, aesKey, data);
        resultBox.innerText = new TextDecoder().decode(decrypted);
        resultBox.style.display = 'block';
      }
    } catch (e) {
      alert("Processing failed! Ensure your key and input data are correct.");
    }
  }

  // --- File Processing ---
  async function processFile(action) {
    const keyStr = document.getElementById('fileKey').value.trim();
    const fileInput = document.getElementById('fileInput');

    if (!keyStr || !fileInput.files[0]) {
      alert("Please select a file and enter a secret key.");
      return;
    }

    const file = fileInput.files[0];

    // Demo Limitation: Limit file size to 1MB (1 * 1024 * 1024 Bytes)
    const MAX_SIZE = 1 * 1024 * 1024;
    if (action === 'encrypt' && file.size > MAX_SIZE) {
      alert("Demo Version Limit: File size is limited to 1MB. Purchase the full source code for unlimited file size!");
      return;
    }

    const reader = new FileReader();

    reader.onload = async function(e) {
      try {
        const fileBuffer = e.target.result;
        const aesKey = await deriveAESKeyFromRaw(keyStr);

        if (action === 'encrypt') {
          const iv = crypto.getRandomValues(new Uint8Array(12));
          const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aesKey, fileBuffer);

          const combined = new Uint8Array(iv.length + encrypted.byteLength);
          combined.set(iv, 0);
          combined.set(new Uint8Array(encrypted), iv.length);

          const blob = new Blob([combined], { type: 'application/octet-stream' });
          downloadFile(blob, file.name + ".enc");
        } else {
          const combined = new Uint8Array(fileBuffer);
          const iv = combined.slice(0, 12);
          const data = combined.slice(12);

          const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, aesKey, data);
          const origName = file.name.replace(/\.enc$/, '') || 'decrypted_file';
          const blob = new Blob([decrypted]);
          downloadFile(blob, origName);
        }
      } catch (err) {
        alert("File operation failed! Wrong key or corrupted file.");
      }
    };

    reader.readAsArrayBuffer(file);
  }

  function downloadFile(blob, filename) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
  }

  // --- ECDH Handshake Processing ---
  async function generateKeypair() {
    localKeyPair = await crypto.subtle.generateKey(
      { name: 'ECDH', namedCurve: 'P-256' },
      true,
      ['deriveKey', 'deriveBits']
    );

    const exportedPublic = await crypto.subtle.exportKey('spki', localKeyPair.publicKey);
    document.getElementById('myPublicKey').value = bufferToBase64(exportedPublic);
  }

  async function computeSharedSecret() {
    const peerB64 = document.getElementById('peerPublicKey').value.trim();
    const resultBox = document.getElementById('handshakeResult');

    if (!localKeyPair || !peerB64) {
      alert("Please generate your keypair first and enter recipient's public key.");
      return;
    }

    try {
      const peerBuffer = base64ToBuffer(peerB64);
      const peerKey = await crypto.subtle.importKey(
        'spki',
        peerBuffer,
        { name: 'ECDH', namedCurve: 'P-256' },
        false,
        []
      );

      const sharedBits = await crypto.subtle.deriveBits(
        { name: 'ECDH', public: peerKey },
        localKeyPair.privateKey,
        256
      );

      const sharedB64 = bufferToBase64(sharedBits);
      resultBox.innerText = "Computed Shared Secret Key (Derived): " + sharedB64;
      resultBox.style.display = 'block';

      // Auto-fill inputs for usability
      document.getElementById('textKey').value = sharedB64;
      document.getElementById('fileKey').value = sharedB64;
    } catch (e) {
      alert("Handshake failed! Invalid public key structure.");
    }
  }
</script>

</body>
</html>
