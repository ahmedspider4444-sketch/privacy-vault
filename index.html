<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PrivacyVault - Offline AES-256</title>
    <style>
        :root {
            --primary: #0f172a; --accent: #3b82f6; --success: #10b981;
            --warning: #f59e0b; --bg: #f8fafc; --border: #e2e8f0; --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: #1e293b; min-height: 100vh; padding: 16px; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: var(--radius); box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; padding-bottom: 24px; }
        .app-header { background: linear-gradient(135deg, var(--primary), #1e293b); color: white; padding: 20px 24px; text-align: center; }
        .app-header h1 { font-size: 1.4rem; margin-bottom: 4px; }
        .offline-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.15); color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; margin-top: 8px; }
        .tabs { display: flex; background: #e2e8f0; padding: 4px; margin: 16px 20px 0 20px; border-radius: 12px; gap: 4px; }
        .tab-btn { flex: 1; padding: 10px 8px; background: transparent; border: none; font-size: 0.8rem; font-weight: 600; color: #64748b; cursor: pointer; border-radius: 8px; }
        .tab-btn.active { color: #0f172a; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }
        .tab-content { display: none; padding: 20px; }
        .tab-content.active { display: block; }
        label { font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; display: block; }
        textarea, input[type="text"] { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 10px; font-size: 0.95rem; background: #fafbfc; }
        textarea { height: 100px; resize: vertical; }
        .btn-group { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
        button { padding: 12px 20px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; color: white; flex: 1; }
        .btn-enc { background: var(--accent); }
        .btn-dec { background: var(--success); }
        .btn-warning { background: var(--warning); color: #1e293b; }
        .result-box { background: #f1f5f9; border: 2px dashed var(--border); padding: 14px; border-radius: 10px; margin-top: 12px; font-family: monospace; word-break: break-all; }
        .file-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 25px; text-align: center; cursor: pointer; background: #fafbfc; }
    </style>
</head>
<body>

<div class="container">
    <div class="app-header">
        <h1>PrivacyVault</h1>
        <div class="offline-badge">Data never leaves your device</div>
    </div>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('text', this)">Text</button>
        <button class="tab-btn" onclick="switchTab('file', this)">Files</button>
        <button class="tab-btn" onclick="switchTab('handshake', this)">Handshake</button>
    </div>

    <!-- Text Tab -->
    <div id="tab-text" class="tab-content active">
        <label>Encryption Key</label>
        <input type="text" id="keyInput" placeholder="Enter key...">
        <label style="margin-top:12px;">Text</label>
        <textarea id="textInput" placeholder="Type here..."></textarea>
        <div class="btn-group">
            <button class="btn-enc" onclick="processText(true)">Encrypt</button>
            <button class="btn-dec" onclick="processText(false)">Decrypt</button>
        </div>
        <div class="result-box" id="resultOutput">Result...</div>
    </div>

    <!-- File Tab -->
    <div id="tab-file" class="tab-content">
        <label>Encryption Key</label>
        <input type="text" id="fileKey" placeholder="Enter key...">
        <div class="file-zone" onclick="document.getElementById('fileInput').click()">
            <p>Tap to select a file</p>
        </div>
        <input type="file" id="fileInput" style="display:none;" onchange="handleFileSelect(event)">
        <p id="fileStatus" style="font-size:0.8rem; margin-top:6px; text-align:center;"></p>
        <div class="btn-group">
            <button class="btn-enc" onclick="encryptFile()">Encrypt</button>
            <button class="btn-dec" onclick="decryptFile()">Decrypt</button>
        </div>
        <div class="result-box" id="fileResult">Output...</div>
    </div>

    <!-- Handshake Tab -->
    <div id="tab-handshake" class="tab-content">
        <label>Your Public Key</label>
        <textarea id="myPublicKey" readonly></textarea>
        <label style="margin-top:8px;">Peer's Public Key</label>
        <textarea id="peerPublicKey"></textarea>
        <div class="btn-group">
            <button class="btn-warning" onclick="generateKeyPair()">Generate</button>
            <button class="btn-warning" onclick="deriveSharedKey()">Derive</button>
        </div>
        <p id="handshakeStatus" style="font-size:0.8rem; margin-top:8px;"></p>
    </div>
</div>

<script>
    const MAX_FILE_SIZE = 500 * 1024 * 1024;
    let selectedFileData = null, localKeyPair = null;
    const CHUNK_SIZE = 2 * 1024 * 1024;

    async function deriveKey(password, salt) {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
        return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 200000, hash: "SHA-256" }, keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    }

    function generateRandomSalt() { return crypto.getRandomValues(new Uint8Array(16)); }
    function arrayBufferToBase64(buffer) { return btoa(String.fromCharCode(...new Uint8Array(buffer))); }
    function base64ToArrayBuffer(base64) { return Uint8Array.from(atob(base64), c => c.charCodeAt(0)).buffer; }

    async function processText(isEncrypt) {
        const text = document.getElementById('textInput').value;
        const password = document.getElementById('keyInput').value.trim();
        const out = document.getElementById('resultOutput');
        if (!password) { alert("Enter a key."); return; }
        try {
            if (isEncrypt) {
                const salt = generateRandomSalt();
                const key = await deriveKey(password, salt);
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(text));
                out.innerText = arrayBufferToBase64(salt) + ":" + arrayBufferToBase64(iv) + ":" + arrayBufferToBase64(cipher);
            } else {
                const parts = text.split(":");
                const salt = new Uint8Array(base64ToArrayBuffer(parts[0]));
                const iv = new Uint8Array(base64ToArrayBuffer(parts[1]));
                const key = await deriveKey(password, salt);
                const dec = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, base64ToArrayBuffer(parts[2]));
                out.innerText = new TextDecoder().decode(dec);
            }
        } catch (e) { alert("Failed."); }
    }

    function handleFileSelect(e) {
        const file = e.target.files[0];
        if (!file) return;
        selectedFileData = file;
        document.getElementById('fileStatus').innerText = file.name;
    }

    async function encryptFile() {
        if (!selectedFileData) return;
        const password = document.getElementById('fileKey').value.trim();
        const status = document.getElementById('fileResult');
        status.innerText = "Encrypting...";
        try {
            const salt = generateRandomSalt();
            const key = await deriveKey(password, salt);
            const parts = [salt];
            let offset = 0;
            while (offset < selectedFileData.size) {
                const chunk = await selectedFileData.slice(offset, offset + CHUNK_SIZE).arrayBuffer();
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const enc = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, chunk);
                const encArray = new Uint8Array(enc);
                parts.push(new Uint8Array(new Uint32Array([encArray.byteLength]).buffer), iv, encArray);
                offset += CHUNK_SIZE;
            }
            downloadBlob(new Blob(parts, { type: 'application/octet-stream' }), selectedFileData.name + ".enc");
            status.innerText = "Encrypted.";
        } catch (e) { status.innerText = "Failed."; }
    }

    async function decryptFile() {
        if (!selectedFileData) return;
        const password = document.getElementById('fileKey').value.trim();
        const status = document.getElementById('fileResult');
        status.innerHTML = "Decrypting...";
        try {
            const salt = new Uint8Array(await selectedFileData.slice(0, 16).arrayBuffer());
            const key = await deriveKey(password, salt);
            const chunks = [];
            let offset = 16;
            while (offset < selectedFileData.size) {
                const size = new Uint32Array(await selectedFileData.slice(offset, offset + 4).arrayBuffer())[0];
                offset += 4;
                const iv = new Uint8Array(await selectedFileData.slice(offset, offset + 12).arrayBuffer());
                offset += 12;
                const dec = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, await selectedFileData.slice(offset, offset + size).arrayBuffer());
                chunks.push(new Uint8Array(dec));
                offset += size;
            }
            let name = selectedFileData.name;
            while (name.endsWith(".txt") || name.endsWith(".enc")) name = name.slice(0, name.lastIndexOf('.'));
            const ext = name.includes('.') ? name.slice(name.lastIndexOf('.')) : '';
            const blob = new Blob(chunks, { type: ext === '.jpg' || ext === '.jpeg' ? 'image/jpeg' : ext === '.mp4' ? 'video/mp4' : 'application/octet-stream' });
            
            status.innerHTML = '';
            const url = URL.createObjectURL(blob);
            if (ext.match(/\.(jpg|jpeg|png|gif|webp|svg)$/i)) {
                const img = document.createElement('img'); img.src = url; img.style.width = '100%';
                status.appendChild(img);
            } else if (ext.match(/\.(mp4|webm|mov|m4v)$/i)) {
                const vid = document.createElement('video'); vid.src = url; vid.controls = true; vid.style.width = '100%';
                status.appendChild(vid);
            }
            const link = document.createElement('a'); link.href = url; link.download = name; link.innerText = "Download " + name; link.style.display = 'block'; link.style.marginTop = '10px';
            status.appendChild(link);
        } catch (e) { status.innerText = "Decryption failed."; }
    }

    function downloadBlob(blob, name) {
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    async function generateKeyPair() {
        localKeyPair = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey", "deriveBits"]);
        document.getElementById('myPublicKey').value = arrayBufferToBase64(await crypto.subtle.exportKey("spki", localKeyPair.publicKey));
    }

    async function deriveSharedKey() {
        const peer = await crypto.subtle.importKey("spki", base64ToArrayBuffer(document.getElementById('peerPublicKey').value), { name: "ECDH", namedCurve: "P-256" }, false, []);
        const secret = await crypto.subtle.deriveBits({ name: "ECDH", public: peer }, localKeyPair.privateKey, 256);
        const hex = Array.from(new Uint8Array(secret)).map(b => b.toString(16).padStart(2, '0')).join('');
        document.getElementById('keyInput').value = document.getElementById('fileKey').value = hex;
        alert("Shared key set!");
    }

    function switchTab(name, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + name).classList.add('active');
        btn.classList.add('active');
    }
</script>
</body>
</html>
