<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivacyVault - Secure Client-Side Encryption Tool (Demo)</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background-color: var(--card-bg); width: 100%; max-width: 600px; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); border: 1px solid var(--border-color); }
    h1 { font-size: 1.5rem; text-align: center; margin-bottom: 5px; color: var(--accent-color); }
    p.subtitle { text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; }
    .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); }
    .tab-btn { flex: 1; padding: 10px; background: none; border: none; color: var(--text-muted); font-weight: 600; cursor: pointer; transition: 0.3s; }
    .tab-btn.active { color: var(--accent-color); border-bottom: 2px solid var(--accent-color); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: var(--text-muted); }
    textarea, input[type="text"], input[type="file"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background-color: var(--bg-color); color: var(--text-color); font-size: 0.9rem; }
    textarea { resize: vertical; min-height: 80px; }
    .btn-group { display: flex; gap: 10px; }
    button.btn { flex: 1; padding: 12px; border: none; border-radius: 6px; background-color: var(--accent-color); color: #000; font-weight: bold; cursor: pointer; transition: 0.3s; }
    button.btn:hover { background-color: var(--accent-hover); color: #fff; }
    .result-box { margin-top: 15px; padding: 10px; background-color: var(--bg-color); border: 1px dashed var(--border-color); border-radius: 6px; word-break: break-all; font-family: monospace; font-size: 0.85rem; }
  </style>
</head>
<body>

<div class="container">
  <h1>PrivacyVault</h1>
  <p class="subtitle">Client-Side Zero-Knowledge Encryption Suite (Demo)</p>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('text-tab')">Text</button>
    <button class="tab-btn" onclick="switchTab('file-tab')">Files</button>
    <button class="tab-btn" onclick="switchTab('handshake-tab')">Handshake</button>
  </div>

  <div id="text-tab" class="tab-content active">
    <div class="form-group">
      <label for="textKey">Secret Key / Shared Key:</label>
      <input type="text" id="textKey" placeholder="Enter key or generate one in Handshake">
    </div>
    <div class="form-group">
      <label for="textData">Text Message:</label>
      <textarea id="textData" placeholder="Enter text to encrypt or ciphertext to decrypt..."></textarea>
    </div>
    <div class="btn-group">
      <button class="btn" onclick="processText('encrypt')">Encrypt Text</button>
      <button class="btn" onclick="processText('decrypt')">Decrypt Text</button>
    </div>
    <div id="textResult" class="result-box" style="display: none;"></div>
  </div>

  <div id="file-tab" class="tab-content">
    <div class="form-group">
      <label for="fileKey">Secret Key / Shared Key:</label>
      <input type="text" id="fileKey" placeholder="Enter key for file encryption/decryption">
    </div>
    <div class="form-group">
      <label for="fileInput">Select File:</label>
      <input type="file" id="fileInput">
    </div>
    <div class="btn-group">
      <button class="btn" onclick="processFile('encrypt')">Encrypt File</button>
      <button class="btn" onclick="processFile('decrypt')">Decrypt File</button>
    </div>
  </div>

  <div id="handshake-tab" class="tab-content">
    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px;">Generate ECDH P-256 keypair locally to compute a shared secret with another party.</p>
    <button class="btn" style="width: 100%; margin-bottom: 15px;" onclick="generateKeypair()">1. Generate Keypair</button>
    <div class="form-group">
      <label>Your Public Key:</label>
      <textarea id="myPublicKey" readonly></textarea>
    </div>
    <div class="form-group">
      <label for="peerPublicKey">Recipient's Public Key:</label>
      <textarea id="peerPublicKey" placeholder="Paste recipient's public key here..."></textarea>
    </div>
    <button class="btn" style="width: 100%;" onclick="computeSharedSecret()">2. Compute Shared Secret Key</button>
    <div id="handshakeResult" class="result-box" style="display: none;"></div>
  </div>
</div>

<script>
  let localKeyPair = null;
  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.target.classList.add('active');
  }
  function bufferToBase64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
  function base64ToBuffer(b64) {
    const binaryStr = atob(b64); const len = binaryStr.length; const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) { bytes[i] = binaryStr.charCodeAt(i); }
    return bytes.buffer;
  }
  async function deriveAESKeyFromRaw(secretString) {
    const enc = new TextEncoder(); const keyData = enc.encode(secretString);
    const hash = await crypto.subtle.digest('SHA-256', keyData);
    return crypto.subtle.importKey('raw', hash, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
  }
  async function processText(action) {
    const keyStr = document.getElementById('textKey').value.trim();
    const text = document.getElementById('textData').value.trim();
    const resultBox = document.getElementById('textResult');
    if (!keyStr || !text) { alert("Please provide key and text."); return; }
    if (action === 'encrypt' && text.length > 50) { alert("Demo Version Limit: Text limited to 50 chars."); return; }
    try {
      const aesKey = await deriveAESKeyFromRaw(keyStr);
      if (action === 'encrypt') {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aesKey, new TextEncoder().encode(text));
        const combined = new Uint8Array(iv.length + encrypted.byteLength); combined.set(iv, 0); combined.set(new Uint8Array(encrypted), iv.length);
        resultBox.innerText = bufferToBase64(combined.buffer); resultBox.style.display = 'block';
      } else {
        const combined = new Uint8Array(base64ToBuffer(text));
        const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: combined.slice(0, 12) }, aesKey, combined.slice(12));
        resultBox.innerText = new TextDecoder().decode(decrypted); resultBox.style.display = 'block';
      }
    } catch (e) { alert("Processing failed!"); }
  }
  async function processFile(action) {
    const keyStr = document.getElementById('fileKey').value.trim();
    const file = document.getElementById('fileInput').files[0];
    if (!keyStr || !file) { alert("Please select a file and enter key."); return; }
    if (action === 'encrypt' && file.size > 1 * 1024 * 1024) { alert("Demo Limit: 1MB max."); return; }
    const reader = new FileReader();
    reader.onload = async function(e) {
      try {
        const aesKey = await deriveAESKeyFromRaw(keyStr);
        if (action === 'encrypt') {
          const iv = crypto.getRandomValues(new Uint8Array(12));
          const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aesKey, e.target.result);
          const combined = new Uint8Array(iv.length + encrypted.byteLength); combined.set(iv, 0); combined.set(new Uint8Array(encrypted), iv.length);
          const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([combined])); a.download = file.name + ".enc"; a.click();
        } else {
          const combined = new Uint8Array(e.target.result);
          const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: combined.slice(0, 12) }, aesKey, combined.slice(12));
          const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([decrypted])); a.download = file.name.replace(/\.enc$/, ''); a.click();
        }
      } catch (err) { alert("Failed! Wrong key."); }
    };
    reader.readAsArrayBuffer(file);
  }
  async function generateKeypair() {
    localKeyPair = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey', 'deriveBits']);
    document.getElementById('myPublicKey').value = bufferToBase64(await crypto.subtle.exportKey('spki', localKeyPair.publicKey));
  }
  async function computeSharedSecret() {
    const peerB64 = document.getElementById('peerPublicKey').value.trim();
    if (!localKeyPair || !peerB64) { alert("Generate keypair and enter peer key."); return; }
    try {
      const sharedBits = await crypto.subtle.deriveBits({ name: 'ECDH', public: await crypto.subtle.importKey('spki', base64ToBuffer(peerB64), { name: 'ECDH', namedCurve: 'P-256' }, false, []) }, localKeyPair.privateKey, 256);
      const sharedB64 = bufferToBase64(sharedBits);
      document.getElementById('handshakeResult').innerText = "Shared Key: " + sharedB64; document.getElementById('handshakeResult').style.display = 'block';
      document.getElementById('textKey').value = sharedB64; document.getElementById('fileKey').value = sharedB64;
    } catch (e) { alert("Handshake failed!"); }
  }
</script>

</body>
</html>
